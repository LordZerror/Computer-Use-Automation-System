<!doctype html>
<!--
  Deliberately hostile surface (Section 3.1/3.7): a button drawn onto a
  <canvas>, not a real DOM element. There is no accessible role, name, or
  test id to find -- perceive.snapshot() must return zero elements here,
  which is exactly what forces the vision fallback path to trigger. This is
  the "only reliable surface is what a human operator sees" case taken
  literally, standing in for e.g. a legacy desktop app rendering its own
  widgets.
-->
<html>
<head><title>Canvas-only surface</title></head>
<body style="margin:0">
  <canvas id="c" width="400" height="200"></canvas>
  <div id="status" style="position:absolute;left:-9999px"></div>
  <script>
    const ctx = document.getElementById('c').getContext('2d');
    function draw(label) {
      ctx.clearRect(0, 0, 400, 200);
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(150, 80, 100, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.fillText(label, 165, 105);
    }
    draw('Click me');
    document.getElementById('c').addEventListener('click', (e) => {
      const r = e.target.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (x >= 150 && x <= 250 && y >= 80 && y <= 120) {
        draw('Clicked!');
        document.title = 'Clicked';
        // The button itself is pixels on a canvas, not a DOM node -- but a
        // real app still needs some DOM-observable signal of success for a
        // checkpoint to assert against, the same way a game UI updates a
        // real status bar even when the play area is canvas-rendered.
        document.getElementById('status').textContent = 'Clicked';
      }
    });
  </script>
</body>
</html>
